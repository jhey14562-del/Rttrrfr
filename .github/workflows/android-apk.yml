name: Build Local Voice Control APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'voice-control/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p voice-control assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-voice-control-debug-apk
          path: voice-control/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
